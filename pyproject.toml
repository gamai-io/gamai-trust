[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gamai-trust"
version = "0.3.4"
description = "Evidence-bound trust layer for agents: verify claims, remember refusals, score false success."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Renato Šuster", email = "renato@gamatrade.ba"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/gamai-io/gamai-trust"
Repository = "https://github.com/gamai-io/gamai-trust"
Issues = "https://github.com/gamai-io/gamai-trust/issues"

[project.scripts]
gamai-trust = "gamai_trust.cli:main"
gamai-trust-mcp = "gamai_trust.mcp_server:main"

[tool.setuptools]
packages = ["gamai_trust", "gamai_trust._components"]
